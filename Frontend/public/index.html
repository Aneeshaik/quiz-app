<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>React App</title>
  </head>
  <body class="dark:text-white relative bg-slate-50 dark:bg-slate-950">
    <button class="absolute bottom-8 right-10" onclick="document.documentElement.classList.toggle('dark')">
      <!-- Dark Mode Icon (Moon) -->
      <span id="dark-icon" class="hidden bg-white p-3 rounded-full dark:block">
        <img src="/dark-mode-icon.svg" />
      </span>
      
      <!-- Light Mode Icon (Sun) -->
      <span id="light-icon" class="block bg-black p-3 rounded-full dark:hidden">
        <img src="/light-mode-icon.svg" />
      </span>
    </button>
    
      <div id="root"></div>
    </div>
    
  </body>
</html>
